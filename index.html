<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ストーリー仕訳ドリル Pro</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --danger: #ef4444;
      --success: #10b981;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 1.25rem;
      text-align: center;
      margin-top: 0;
      margin-bottom: 16px;
    }
    .card {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      width: 100%;
    }
    .story-text {
      font-size: 1.05rem;
      line-height: 1.6;
      font-weight: 500;
      margin: 0;
    }
    .split-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-bottom: 16px;
    }
    @media (max-width: 560px) {
      .split-container {
        grid-template-columns: 1fr;
      }
    }
    .side-column {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      width: 100%;
    }
    .side-title {
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 8px;
      text-align: center;
      color: #475569;
    }
    .entry-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
      width: 100%;
    }
    .entry-row input[type="text"] {
      flex: 1.2;
      width: 0;
      padding: 8px 6px;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      min-width: 0;
    }
    .entry-row input[type="number"] {
      flex: 1;
      width: 0;
      padding: 8px 6px;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      min-width: 0;
    }
    .btn-remove {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: var(--danger);
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      line-height: 1;
      flex-shrink: 0;
    }
    .btn-add {
      width: 100%;
      background: #e2e8f0;
      border: 1px dashed #94a3b8;
      border-radius: 6px;
      padding: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      color: #475569;
    }
    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    .result-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      display: none;
      font-size: 0.95rem;
      line-height: 1.5;
      width: 100%;
    }
    .result-box.correct {
      background: #dcfce7;
      border: 1px solid var(--success);
      color: #15803d;
    }
    .result-box.wrong {
      background: #fee2e2;
      border: 1px solid var(--danger);
      color: #b91c1c;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
      width: 100%;
    }
    .nav-btn {
      background: #64748b;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
    }
    .clear-card {
      text-align: center;
      padding: 30px 16px;
      display: none;
    }
    .clear-card h2 {
      font-size: 1.5rem;
      color: #1e293b;
      margin-bottom: 12px;
    }
    .clear-card p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #475569;
      margin-bottom: 24px;
    }
    details {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      width: 100%;
    }
    textarea {
      width: 100%;
      height: 120px;
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>ストーリー仕訳ドリル Pro</h1>

  <!-- 問題出題エリア -->
  <div id="quiz-area">
    <div class="card">
      <div style="font-size: 0.85rem; color: #64748b; margin-bottom: 6px;" id="q-number">第 1 問</div>
      <p class="story-text" id="story-display">読み込み中...</p>
    </div>

    <div class="split-container">
      <div class="side-column">
        <div class="side-title">借方（Debit）</div>
        <div id="debit-rows"></div>
        <button type="button" class="btn-add" onclick="addRow('debit')">＋ 行を追加</button>
      </div>

      <div class="side-column">
        <div class="side-title">貸方（Credit）</div>
        <div id="credit-rows"></div>
        <button type="button" class="btn-add" onclick="addRow('credit')">＋ 行を追加</button>
      </div>
    </div>

    <button type="button" class="btn-submit" onclick="checkAnswer()">判定する</button>
    <div id="result-display" class="result-box"></div>

    <div class="nav-buttons">
      <button type="button" class="nav-btn" onclick="prevQuestion()">◀ 前の問題</button>
      <button type="button" class="nav-btn" id="next-btn" onclick="nextQuestion()">次の問題 ▶</button>
    </div>
  </div>

  <!-- お疲れ様・クリア画面エリア -->
  <div id="clear-area" class="clear-card card">
    <h2>🎉 お疲れ様でした！</h2>
    <p id="score-text">全問の演習が完了しました！</p>
    <button type="button" class="btn-submit" onclick="restartQuiz()">もう一度最初から挑戦する 🔄</button>
  </div>

  <!-- 問題データ読み込み -->
  <details>
    <summary>⚙️ 新しいストーリー問題を読み込む</summary>
    <textarea id="json-input" placeholder="JSONコードを貼り付けてください"></textarea>
    <button type="button" class="btn-submit" style="background:#059669; margin-top:6px;" onclick="loadCustomData()">問題を反映する</button>
  </details>
</div>

<script>
const defaultData = [
  {
    story: "【簿記2級・固定資産の売却】備品（取得原価 50,000円、減価償却累計額 35,000円・間接法）を 12,000円で売却し、代金は後日受取（未収入金）とした。",
    debit: [
      { account: "減価償却累計額", amount: 35000 },
      { account: "未収入金", amount: 12000 },
      { account: "固定資産売却損", amount: 3000 }
    ],
    credit: [
      { account: "備品", amount: 50000 }
    ],
    explanation: "備品の帳簿価額は 50,000 - 35,000 = 15,000円です。これを12,000円で売却したため、差額の3,000円が固定資産売却損（費用）となります。"
  }
];

let questions = [];
let currentIndex = 0;
let correctCount = 0;
let answeredQuestions = new Set();

function init() {
  const saved = localStorage.getItem("boki_pro_drill_data");
  if (saved) {
    try {
      questions = JSON.parse(saved);
    } catch (e) {
      questions = defaultData;
    }
  } else {
    questions = defaultData;
  }
  restartQuiz();
}

function restartQuiz() {
  currentIndex = 0;
  correctCount = 0;
  answeredQuestions.clear();
  document.getElementById("quiz-area").style.display = "block";
  document.getElementById("clear-area").style.display = "none";
  loadQuestion(0);
}

function createRowHTML(account = "", amount = "") {
  const div = document.createElement("div");
  div.className = "entry-row";
  div.innerHTML = `
    <input type="text" placeholder="科目" value="${account}" lang="ja">
    <input type="number" placeholder="金額" value="${amount}">
    <button type="button" class="btn-remove" onclick="removeRow(this)">✕</button>
  `;
  return div;
}

function addRow(side) {
  const container = document.getElementById(`${side}-rows`);
  container.appendChild(createRowHTML("", ""));
}

function removeRow(button) {
  const row = button.closest(".entry-row");
  const container = row.parentElement;
  if (container.children.length > 1) {
    row.remove();
  } else {
    alert("最低1行は必要です。");
  }
}

function loadQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  currentIndex = index;

  document.getElementById("q-number").textContent = `第 ${index + 1} 問 / 全 ${questions.length} 問`;
  document.getElementById("story-display").textContent = questions[index].story;

  document.getElementById("debit-rows").innerHTML = "";
  document.getElementById("credit-rows").innerHTML = "";
  addRow("debit");
  addRow("credit");

  const resultBox = document.getElementById("result-display");
  resultBox.style.display = "none";
  resultBox.className = "result-box";

  // 最終問の場合、ボタンの文言を「結果を見る」に変更
  const nextBtn = document.getElementById("next-btn");
  if (currentIndex === questions.length - 1) {
    nextBtn.textContent = "結果を見る 🎉";
  } else {
    nextBtn.textContent = "次の問題 ▶";
  }
}

function getEntries(side) {
  const rows = document.getElementById(`${side}-rows`).children;
  const entries = [];
  for (let row of rows) {
    const inputs = row.querySelectorAll("input");
    const account = inputs[0].value.trim();
    const amount = parseInt(inputs[1].value, 10);
    if (account && !isNaN(amount)) {
      entries.push({ account, amount });
    }
  }
  return entries;
}

function checkAnswer() {
  const q = questions[currentIndex];
  const userDebit = getEntries("debit");
  const userCredit = getEntries("credit");

  const correctDebit = Array.isArray(q.debit) ? q.debit : [q.debit];
  const correctCredit = Array.isArray(q.credit) ? q.credit : [q.credit];

  const matchSide = (user, correct) => {
    if (user.length !== correct.length) return false;
    const sortedUser = [...user].sort((a, b) => a.account.localeCompare(b.account) || a.amount - b.amount);
    const sortedCorrect = [...correct].sort((a, b) => a.account.localeCompare(b.account) || a.amount - b.amount);

    return sortedUser.every((u, idx) => 
      u.account === sortedCorrect[idx].account && u.amount === sortedCorrect[idx].amount
    );
  };

  const isDebitOk = matchSide(userDebit, correctDebit);
  const isCreditOk = matchSide(userCredit, correctCredit);

  const resultBox = document.getElementById("result-display");
  resultBox.style.display = "block";

  if (isDebitOk && isCreditOk) {
    resultBox.className = "result-box correct";
    resultBox.innerHTML = `<strong>正解です！ 🎉</strong><br>${q.explanation || ""}`;
    if (!answeredQuestions.has(currentIndex)) {
      correctCount++;
      answeredQuestions.add(currentIndex);
    }
  } else {
    resultBox.className = "result-box wrong";
    const debitText = correctDebit.map(d => `(${d.account}: ${d.amount.toLocaleString()}円)`).join(" ");
    const creditText = correctCredit.map(c => `(${c.account}: ${c.amount.toLocaleString()}円)`).join(" ");
    resultBox.innerHTML = `
      <strong>不正解です…</strong><br>
      【正解の仕訳】<br>
      借方: ${debitText}<br>
      貸方: ${creditText}<br><br>
      【解説】<br>${q.explanation || ""}
    `;
    answeredQuestions.add(currentIndex);
  }
}

function prevQuestion() {
  if (currentIndex > 0) loadQuestion(currentIndex - 1);
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    loadQuestion(currentIndex + 1);
  } else {
    // 最終問題を超えたらクリア画面を表示
    showClearScreen();
  }
}

function showClearScreen() {
  document.getElementById("quiz-area").style.display = "none";
  const clearArea = document.getElementById("clear-area");
  clearArea.style.display = "block";

  const total = questions.length;
  document.getElementById("score-text").innerHTML = `
    すべての仕訳問題を完走しました！お疲れ様でした。<br><br>
    <strong>あなたの成績: ${total} 問中 ${correctCount} 問 正解！</strong><br>
    ${correctCount === total ? "満点達成！完璧な仕訳力です！ 🏆" : "間違えた問題も復習してマスターを目指しましょう！ 💪"}
  `;
}

function loadCustomData() {
  const input = document.getElementById("json-input").value;
  try {
    const data = JSON.parse(input);
    if (!Array.isArray(data) || data.length === 0) throw new Error();
    questions = data;
    localStorage.setItem("boki_pro_drill_data", JSON.stringify(data));
    alert("新しい問題を読み込みました！");
    restartQuiz();
  } catch (e) {
    alert("JSONの形式が正しくありません。正しいデータを貼り付けてください。");
  }
}

window.onload = init;
</script>

</body>
</html>
